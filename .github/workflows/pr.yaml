---
# EmoPlay CI — fast gate for pushes and pull requests.
#
# The repo is private (emoeem/emoplay), so GitHub Actions minutes are the
# scarce resource: this workflow runs the full linux analyze + test + build
# gate in ONE ubuntu job (a single Flutter setup + pub get), and every
# other platform (windows / macos / android / linux arm64) is packaged only
# by the tag-triggered release.yaml. Generated .g.dart files are committed,
# so build_runner is not needed here.
name: "CI"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-ci:
    name: "Linux analyze + test + build"
    runs-on: "ubuntu-latest"
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      # SPEC §9 gate semantics: only errors are fatal, infos/warnings are
      # allowed to exist.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        shell: bash

      # Native toolchain for the Linux build, plus the VA/VDPAU runtime
      # libs that the media_kit bundled libmpv.so.2 links against. The
      # runtime deps must exist BEFORE `flutter test`: the equalizer suite
      # drives a real libmpv core, and dlopen only reports the first
      # missing dependency at a time. Release binaries are built by
      # release.yaml on tags.
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev \
            libva2 libva-drm2 libva-x11-2 libva-wayland2 libvdpau1
        shell: bash

      - name: Run tests
        run: flutter test
        shell: bash

      - name: Build for Linux
        run: flutter build linux --debug
        shell: bash
