---
# EmoPlay release — triggered by tags only (v*), so the all-platform
# packaging matrix (windows / macos / android / linux amd64 + arm64) never
# burns CI minutes on pushes or PRs; the push/PR gate lives in pr.yaml
# (linux analyze + test + build, single job).
#
# No secret injection: EmoPlay uses no dart-defines (no danmaku/API keys —
# the Kazumi DANDANAPI_*/KAZUMI_* defines were removed with the bangumi
# business layer). Android APKs are left unsigned; add a signing step when
# a release keystore exists. iOS is kept as a commented block for later.
name: "release"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  flutter-test:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      # Same runtime closure as pr.yaml's install step: the equalizer suite
      # drives a real libmpv core (media_kit bundled libmpv.so.2 needs the
      # VA/VDPAU libs plus pulse/xv/egl/gbm/drm/unwind/lcms2/archive/alsa
      # runtime libs), so they must exist before `flutter test`. t64 names
      # are the noble (24.04) ones — libarchive13/libasound2/libmpg123-0
      # do not exist on ubuntu-latest.
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev \
            libva2 libva-drm2 libva-x11-2 libva-wayland2 libvdpau1 \
            libpulse0 libxv1 libegl1 libgbm1 libdrm2 \
            libunwind8 liblcms2-2 libarchive13t64 libasound2t64 \
            libdbus-1-3 libsndfile1 libmpg123-0t64 libopus0 libogg0
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        shell: bash

  flutter-build-android:
    name: "Release for Android"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    timeout-minutes: 40
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        shell: bash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Build Flutter for Android
        run: >-
          flutter build apk --release --split-per-abi
        shell: bash
      # Unsigned APKs; wire filippoLeporati93/android-release-signer here
      # once SIGNING_KEY_BASE64 / KEY_ALIAS / KEY_STORE_PASSWORD secrets
      # exist on the private repo.
      - name: Upload Android outputs
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: build/app/outputs/flutter-apk/*-release.apk

  flutter-build-windows:
    name: "Release for Windows"
    needs: [flutter-test, flutter-analyze]
    runs-on: "windows-latest"
    timeout-minutes: 45
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      # flutter-version-file shells out to `yq`, which windows runners do not
      # preinstall (run 42720144705 "yq not found") — install it first, same
      # as Kazumi's release workflow (choco install yq before flutter-action).
      - name: Install yq
        run: choco install yq
        shell: pwsh
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          # Single-sourced from pubspec.yaml environment.flutter (currently
          # 3.47.9), matching every other job in this file.
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: pwsh
      - name: Build Flutter for Windows
        run: flutter build windows --release
        shell: pwsh
      - name: Package Windows zip
        run: Compress-Archive build/windows/x64/runner/Release/* EmoPlay_windows_${{ github.ref_name }}.zip
        shell: pwsh
      # msix_config in pubspec.yaml is preconfigured unsigned
      # (sign_msix: false, build_windows: false reuses the build above).
      - name: Build unsigned MSIX
        run: dart run msix:create
        shell: pwsh
      - name: Upload Windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: |
            EmoPlay_windows_*.zip
            build/windows/x64/runner/Release/emoplay.msix

  flutter-build-macos:
    name: "Release for macOS"
    needs: [flutter-test, flutter-analyze]
    runs-on: "macos-latest"
    timeout-minutes: 45
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - run: flutter pub get
      - name: Build Flutter for macOS
        run: flutter build macos --release
      # Zipped .app: unsigned builds can't pass notarization anyway, so a
      # plain zip beats a fragile create-dmg invocation.
      - name: Package macOS zip
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          build/macos/Build/Products/Release/EmoPlay.app
          EmoPlay_macos_${{ github.ref_name }}.zip
      - name: Upload macOS output
        uses: actions/upload-artifact@v4
        with:
          name: macos_outputs
          path: EmoPlay_macos_*.zip

  flutter-build-linux-amd64:
    name: "Release for Linux amd64"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    timeout-minutes: 40
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libayatana-appindicator3-dev libasound2-dev
        shell: bash
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Build Flutter for Linux
        run: flutter build linux --release
        shell: bash
      - name: Package Linux amd64 outputs
        run: ./.github/scripts/package-linux.sh amd64 x64 "${{ github.ref_name }}"
        shell: bash
      # AppImage (linuxdeploy, auto-downloaded into build/appimage-tools/).
      # amd64 is verified locally (2026-11-11, extract-and-run smoke test);
      # arm64 uses linuxdeploy-aarch64.AppImage (URL reachable, verified
      # 2026-11-11) but its packaging can only be exercised in CI.
      - name: Package Linux amd64 AppImage
        run: ./.github/scripts/package-appimage.sh amd64 x64 "${{ github.ref_name }}"
        shell: bash
      - name: Upload Linux amd64 outputs
        uses: actions/upload-artifact@v4
        with:
          name: linux_amd64_outputs
          path: |
            EmoPlay_linux_*_amd64.tar.gz
            EmoPlay_linux_*_amd64.deb
            EmoPlay_linux_*_amd64.AppImage

  flutter-build-linux-arm64:
    name: "Release for Linux arm64"
    needs: [flutter-test, flutter-analyze]
    runs-on: ${{ vars.LINUX_ARM64_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 40
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter for ARM64
        uses: ./.github/actions/flutter-arm64-setup
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Build Flutter for Linux ARM64
        run: flutter build linux --release
        shell: bash
      - name: Package Linux arm64 outputs
        run: ./.github/scripts/package-linux.sh arm64 arm64 "${{ github.ref_name }}"
        shell: bash
      # linuxdeploy ships a native aarch64 AppImage (URL verified 2026-11-11);
      # not locally exercisable on this x86_64 container — CI-only until then.
      - name: Package Linux arm64 AppImage
        run: ./.github/scripts/package-appimage.sh arm64 arm64 "${{ github.ref_name }}"
        shell: bash
      - name: Upload Linux arm64 outputs
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm64_outputs
          path: |
            EmoPlay_linux_*_arm64.tar.gz
            EmoPlay_linux_*_arm64.deb
            EmoPlay_linux_*_arm64.AppImage

  # iOS build, kept for later (needs signing + a macOS runner budget):
  # flutter-build-ios:
  #   name: "Release for iOS"
  #   needs: [flutter-test, flutter-analyze]
  #   runs-on: "macos-latest"
  #   steps:
  #     - name: Clone repository
  #       uses: actions/checkout@v4
  #     - name: Set up Flutter
  #       uses: subosito/flutter-action@v2.16.0
  #       with:
  #         channel: stable
  #         flutter-version-file: pubspec.yaml
  #     - run: flutter pub get
  #     - name: Build IPA (no codesign)
  #       run: flutter build ios --release --no-codesign
  #     - name: Create IPA
  #       run: |
  #         mkdir Payload
  #         cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
  #         find Payload/Runner.app/Frameworks -type d -name "*.framework" \
  #           -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \;
  #         zip -q -r EmoPlay_ios_${{ github.ref_name }}_no_sign.ipa Payload
  #     - name: Upload iOS build
  #       uses: actions/upload-artifact@v4
  #       with:
  #         name: ios_outputs
  #         path: EmoPlay_ios_*.ipa

  release:
    name: "GitHub Release"
    runs-on: "ubuntu-latest"
    timeout-minutes: 15
    needs: [flutter-build-android, flutter-build-windows, flutter-build-macos,
            flutter-build-linux-amd64, flutter-build-linux-arm64]
    permissions:
      contents: write
    steps:
      - name: Download Android outputs
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: android_outputs
      - name: Download Windows outputs
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: windows_outputs
      - name: Download macOS output
        uses: actions/download-artifact@v4
        with:
          name: macos_outputs
          path: macos_outputs
      - name: Download Linux amd64 outputs
        uses: actions/download-artifact@v4
        with:
          name: linux_amd64_outputs
          path: linux_amd64_outputs
      - name: Download Linux arm64 outputs
        uses: actions/download-artifact@v4
        with:
          name: linux_arm64_outputs
          path: linux_arm64_outputs
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Draft release: the run's artifacts are only visible to the
          # maintainer until someone verifies the asset set and publishes
          # manually with `gh release edit <tag> --draft=false` (procedure
          # in docs/guides/BUILD_GUIDE.md). Keeps an alpha/mis-tagged run
          # from grabbing the public Latest slot (pitfall 8(a) in
          # docs/HANDOVER.md); draft releases cannot be Latest.
          draft: true
          files: |
            android_outputs/*.apk
            windows_outputs/*.zip
            windows_outputs/*.msix
            macos_outputs/*.zip
            linux_amd64_outputs/*.tar.gz
            linux_amd64_outputs/*.deb
            linux_amd64_outputs/*.AppImage
            linux_arm64_outputs/*.tar.gz
            linux_arm64_outputs/*.deb
            linux_arm64_outputs/*.AppImage
