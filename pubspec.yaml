name: emoplay
description: "EmoPlay - a local media player built on mpv (media_kit)."
publish_to: "none"
version: 2.0.0-alpha+2000000

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_modular: ^7.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  connectivity_plus: ^6.0.5

  path_provider: ^2.1.5
  crypto: ^3.0.8
  hive_ce: ^2.16.0
  hive_ce_flutter: ^2.3.3
  http: ^1.6.0
  file_picker: ^10.3.7

  flutter_volume_controller: ^2.0.1
  audio_service: ^0.18.15
  audio_service_mpris:
    git:
      url: https://github.com/Predidit/audio-service-mpris.git
      ref: d30b53fb7dbdd8f10ceda7447fe0a0218711a220
  audio_session: ^0.2.2
  dynamic_color: ^1.9.0
  flutter_displaymode: ^0.6.0

  url_launcher: ^6.3.0
  window_manager: ^0.5.1

  tray_manager: ^0.5.0
  dlna_dart: ^0.1.1
  logger: ^2.6.2
  saver_gallery: ^4.1.0
  screen_brightness_android: ^2.1.3
  screen_brightness_ios: ^2.1.2
  screen_brightness_ohos: ^2.1.2
  screen_brightness_platform_interface: ^2.1.0
  synchronized: any
  material_color_utilities: any
  material_new_shapes: ^1.0.0
  path: any
  win32: ^5.15.0
  ffi: ^2.1.0
  media_kit:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit
  media_kit_video:
    git:
      url: https://github.com/Predidit/media-kit.git
      ref: 83b7ca63772856e1ea0158916177e136f7b7b0be
      path: ./media_kit_video
  desktop_drop: ^0.8.4

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mobx_codegen: ^2.7.5
  hive_ce_generator: ^1.10.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.16.12

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/emoplay_icon.png
  image_path_android: assets/icon/emoplay_icon.png
  image_path_ios: assets/icon/emoplay_icon.png
  adaptive_icon_background: "#10141c"
  adaptive_icon_foreground: assets/icon/emoplay_icon.png
  adaptive_icon_monochrome: assets/icon/emoplay_icon.png
  macos:
    generate: true
    image_path: assets/icon/emoplay_icon.png
  windows:
    generate: true
    image_path: assets/icon/emoplay_icon.png
    icon_size: 256

msix_config:
  display_name: EmoPlay
  publisher: CN=EmoPlay, O=EmoPlay, C=CN
  logo_path: assets/icon/emoplay_icon.png
  sign_msix: false
  install_certificate: false
  build_windows: false
  protocol_activation: emoplay

flutter:
  # gen-l10n (l10n.yaml, lib/l10n/*.arb): required for flutter gen-l10n /
  # build to emit the AppLocalizations classes into lib/l10n/generated
  # (i18n skeleton, SPEC §1 — default zh, en structure reserved).
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/shaders/
    - assets/plugins/builtin_sources.json
    - NOTICE.md
